# Nav2 parameters for Unitree Go2 -- SLAM-concurrent variant.
# Copied from nav2_params.yaml (localization-against-a-saved-map variant);
# the only change is removing map_server from the managed lifecycle below.
# Localization and /map both come from slam_toolbox (go2_mapping_slam_toolbox
# .launch.py) running at the same time, not a pre-built map -- no map_server
# needed, static_layer subscribes to slam_toolbox's live /map directly
# (map_subscribe_transient_local already matches its publish QoS).
#
# Robot footprint: 0.70m x 0.35m  |  Max velocity: 0.30 m/s (safety limit)
#
# cmd_vel pipeline:
#   controller_server → cmd_vel_nav
#   velocity_smoother → cmd_vel_smoothed
#   collision_monitor → cmd_vel
#   go2_cmd_vel_bridge → /api/sport/request → robot

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /utlidar/robot_odom_retimed
    bt_loop_duration: 10
    default_server_timeout: 1000  # Nav2 default of 20ms is too tight on this
                                   # compute (confirmed via two independent
                                   # "Timed out waiting for action server to
                                   # acknowledge" failures, 2026-11-09)
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Lowered from 0.5: explore_lite replans immediately on every goal
      # success with no cooldown (confirmed in its source, explore.cpp).
      # A generous tolerance let nearby frontiers count as "reached"
      # near-instantly, triggering a tight replan loop against an
      # unchanged map. Tighter tolerance forces real movement first.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.60

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.1
      batch_size: 4000
      vx_std: 0.15
      vy_std: 0.15
      wz_std: 0.3
      # Raised 2026-11-10: these are MPPI's own velocity ceilings, separate
      # from go2_cmd_vel_bridge's max_vx/vy/wz (and lower than them, so MPPI
      # was the actual binding constraint the whole time). Sized so the
      # commanded speed still clears the robot's confirmed-smooth threshold
      # even after SlowZone's 50% cut -- measured live via velocity_pulse.py
      # and keyboard teleop: forward 0.3 min/0.4 smooth, reverse ~0.4 min/0.5
      # smooth, rotation 0.6 min/0.9+ smooth. Old vx_max=0.40 -> 0.20 after
      # SlowZone, below even the bare forward minimum; old wz_max=0.90 -> 0.45
      # after SlowZone, below the rotation minimum too.
      vx_max: 0.8
      vx_min: -1.0
      vy_max: 0.25
      wz_max: 1.8
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"   # Go2 can strafe
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # Enabled 2026-11-10, paired with the real rectangular footprint
        # replacing robot_radius in both costmaps -- lets MPPI score
        # trajectories against the robot's actual oriented shape instead of
        # a worst-case circle.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_smoothing_distance: 0.5 #1.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0 #14
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Real rectangular body (2026-11-10), replacing the robot_radius: 0.4
      # circle -- that treated every direction as if the robot were as wide
      # as its 0.70m length, including its actual narrow 0.31m width,
      # blocking passages the real body could fit through at the right
      # orientation. Paired with CostCritic.consider_footprint: true below
      # so MPPI actually reasons about heading near obstacles, not just a
      # worst-case circle.
      footprint: "[[-0.35, -0.155], [-0.35, 0.155], [0.35, 0.155], [0.35, -0.155]]"
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /utlidar/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.45
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.15 (2026-11-09) kept the lethal+inflated boundary narrow enough
        # for small rooms/narrow passages, but after switching robot_radius
        # to a real rectangular footprint, 0.15 is below the footprint's own
        # inscribed radius (~0.165m, the largest circle fitting entirely
        # inside it) -- Nav2 itself warns this leaves a thin margin right at
        # the robot's narrow sides where the cost gradient hasn't fully
        # ramped to lethal. 0.20 clears that with real margin while staying
        # well short of the circumscribed radius (~0.40m) that would fully
        # restore MPPI's fast circular-prefilter optimization -- accepting
        # the extra per-cycle CPU cost of full-footprint checking in trade
        # for keeping narrow-passage navigation, confirmed as a real need
        # tonight (2026-11-10).
        inflation_radius: 0.20

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      robot_base_frame: base_link
      global_frame: map
      # Real rectangular body, see local_costmap's footprint comment above.
      footprint: "[[-0.35, -0.155], [-0.35, 0.155], [0.35, 0.155], [0.35, -0.155]]"
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      # Rolling window instead of matching the static map's exact bounds.
      # Confirmed by repeated testing that a fixed-to-the-map costmap keeps
      # racing frontier exploration: a frontier goal is, by definition,
      # right at the edge of the currently-known map, so the costmap is
      # *always* just barely behind wherever the robot needs to go next --
      # faster map_update_interval only narrowed the race, didn't remove it.
      # Rolling + centered on the robot makes "out of bounds" structurally
      # impossible rather than a timing race. Tradeoff: the global planner
      # only sees this window, not the full cumulative map -- fine given
      # explore_lite is weighted toward nearby frontiers (potential_scale
      # 3.0 vs gain_scale 1.0), so goals shouldn't typically exceed this.
      rolling_window: true
      width: 15
      height: 15
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /utlidar/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.45
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.15 (2026-11-09) kept the lethal+inflated boundary narrow enough
        # for small rooms/narrow passages, but after switching robot_radius
        # to a real rectangular footprint, 0.15 is below the footprint's own
        # inscribed radius (~0.165m, the largest circle fitting entirely
        # inside it) -- Nav2 itself warns this leaves a thin margin right at
        # the robot's narrow sides where the cost gradient hasn't fully
        # ramped to lethal. 0.20 clears that with real margin while staying
        # well short of the circumscribed radius (~0.40m) that would fully
        # restore MPPI's fast circular-prefilter optimization -- accepting
        # the extra per-cycle CPU cost of full-footprint checking in trade
        # for keeping narrow-passage navigation, confirmed as a real need
        # tonight (2026-11-10).
        inflation_radius: 0.20

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planners: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.80
    min_rotational_vel: 0.40
    rotational_acc_lim: 1.6
    backup_dist: 0.30
    backup_speed: 0.05

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Raised 2026-11-11: these caps were never updated when MPPI's own
    # vx_max/vx_min/wz_max and the bridge's caps were raised (2026-11-10)
    # -- this node sits between controller_server and collision_monitor in
    # the pipeline (cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed),
    # so it was silently re-clamping every command back down to the old
    # numbers regardless of what MPPI/the bridge allowed. Combined with
    # SlowZone's 50% cut and collision_debounce's 0.4/0.6 deadband, the old
    # caps floored every axis to exactly zero whenever the robot was in/near
    # SlowZone: forward 0.40*0.5=0.20 (<0.4 deadband), reverse
    # -0.15*0.5=-0.075 (<<0.4), lateral 0.25*0.5=0.125 (<<0.4), rotation
    # 0.80*0.5=0.40 (<0.6 angular deadband) -- a deterministic command-
    # blocking condition, not just "MPPI might choose a low speed."
    # Confirmed via Codex review of this source + the diagnostic handoff
    # at docs/DIAGNOSTIC_STUCK_NEAR_OBSTACLES_NO_RECOVERY_2026-11-11.md.
    # Now matches MPPI's own ceilings (vx_max=0.8/vx_min=-1.0/wz_max=1.8);
    # vy is raised generously too even though MPPI's vy_max=0.25 remains
    # the real lateral ceiling and itself still sits below deadband_linear
    # (0.25 < 0.4) -- lateral motion clearing the deadband is a separate,
    # still-open gap, not fixed by this change alone.
    max_velocity: [0.80, 0.80, 1.80]    # [vx, vy, wz] — hard caps
    min_velocity: [-1.00, -0.80, -1.80]
    max_accel:  [0.4, 0.4, 0.8]
    max_decel: [-0.4, -0.4, -0.8]
    odom_topic: /utlidar/robot_odom_retimed
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.01, 0.02] #0.06 0.06 008
    velocity_timeout: 1.0

# ── Safety: collision_monitor ─────────────────────────────────────────────────
# StopZone  — halts the robot before it drives into something
# SlowZone  — cuts velocity when a scan point enters the outer polygon
# Both zones are visualised in RViz for debugging.
#
# Both are DIRECTION-AWARE since 2026-11-12 (type: velocity_polygon). They
# used to be static `type: polygon`, which decides purely on "is a scan point
# inside this box", with no regard for which way the command would move the
# robot. That is a one-way trap: once the obstacle is inside StopZone, EVERY
# command is zeroed, including the one that would back out of it. Measured on
# the 12-goal benchmark (PERF_clean/PERF_drift, 2026-11-12): the robot parked
# at 0.379 m from a pillar -- inside StopZone's 0.50 m half-length -- and
# never moved again. Goals 3 through 11 each travelled exactly 0.00 m, and
# both recovery behaviours failed 10/10 because their escape commands were
# zeroed by the same polygon: MPPI asked for -0.564 m/s of reverse, the
# monitor's output was -0.144, and what finally reached the robot was 0.0.
# Success rate 2/12.
#
# velocity_polygon selects one of several sub-polygons from the COMMANDED
# velocity, so the active stop box covers the direction being travelled.
# Forward commands are still stopped by an obstacle ahead; reverse commands
# are judged against what is behind. The lateral half-width is unchanged in
# every sub-polygon -- only the x extent is split -- so side protection is
# exactly as before. Each sub-polygon keeps a 0.15 m margin on its trailing
# side, so "escaping" can never mean shearing into something immediately
# behind.
#
# The sub-polygon velocity ranges MUST cover every velocity the pipeline can
# emit (velocity_smoother caps: vx in [-1.0, 0.8], wz in [-1.8, 1.8]), with
# margin. If a command matches no sub-polygon the node logs "Velocity is not
# covered by any of the velocity polygons" and KEEPS THE PREVIOUS POLYGON --
# a silent, stale-geometry failure. Grep the startup log for that string.
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    # Raised from 2.0 (2026-11-12). collision_monitor stops publishing
    # cmd_vel_out entirely after this long of continuous zero output. That is
    # the right behaviour when something else may want the topic, but nothing
    # else publishes cmd_vel_raw in this stack, and the silence made an
    # enforced stop indistinguishable from a dead pipeline: collision_debounce
    # saw its input go stale, latched its own fail-safe stop, and the whole
    # condition went silent -- 9447 zero commands and not one log line. Keeping
    # the monitor talking keeps the state observable downstream. See the
    # matching watchdog fix in collision_debounce.py.
    stop_pub_timeout: 10.0
    polygons: ["StopZone", "SlowZone"]
    StopZone:
      type: velocity_polygon
      action_type: stop
      # Was the deprecated `max_points: 3` (Nav2 reads that as min_points 4).
      # Stated directly now -- see also SlowZone, where max_points was
      # silently overriding an explicit min_points.
      min_points: 4
      enabled: true
      visualize: true
      polygon_pub_topic: collision_monitor/stop_zone
      # false: sub-polygons are selected on signed vx. The Go2 is configured
      # Omni, but MPPI's vy_max is 0.25 and strafing is rare; a pure strafe
      # falls into stop_forward, whose lateral half-width is the same 0.275,
      # so sideways protection is identical either way.
      holonomic: false
      velocity_polygons: ["stop_forward", "stop_reverse"]
      # Geometry below preserves the 2026-11-10 sizing: ±0.275 half-width
      # (0.12 m side margin on the 0.70x0.31 m footprint) and 0.50 m ahead of
      # centre (0.15 m front margin). Only the trailing extent is cut back,
      # from 0.50 m to 0.15 m, which is what makes backing out possible.
      stop_forward:
        points: "[[-0.15, -0.275], [-0.15, 0.275], [0.50, 0.275], [0.50, -0.275]]"
        linear_min: 0.0
        linear_max: 1.2
        theta_min: -2.5
        theta_max: 2.5
      stop_reverse:
        points: "[[-0.50, -0.275], [-0.50, 0.275], [0.15, 0.275], [0.15, -0.275]]"
        linear_min: -1.2
        linear_max: 0.0
        theta_min: -2.5
        theta_max: 2.5
    SlowZone:
      type: velocity_polygon
      action_type: slowdown
      # Raised from 0.50 (2026-11-12). The cut is applied upstream of
      # collision_debounce's minimum-executable-speed filter, so a 50% cut
      # turned MPPI's -0.564 m/s escape command into -0.144 -- below half of
      # min_speed_reverse (0.40), which is the band collision_debounce zeroes
      # rather than raises. At 0.70 the same command lands at -0.395, which
      # the filter rounds up to the executable -0.40 instead. Braking margin
      # is still provided by StopZone, which is unchanged in extent ahead.
      slowdown_ratio: 0.7
      # Raised from the Nav2 default (4, i.e. the legacy max_points: 3) --
      # confirmed via bag analysis that a real wall sitting near this
      # polygon's edge was triggering on ordinary per-scan point-count noise
      # at the old threshold (2026-11-09). The `max_points: 6` that used to
      # sit beside this is gone: it silently overrode min_points and happened
      # to resolve to the same 7, so editing min_points would have done
      # nothing (noted 2026-11-12).
      min_points: 7
      enabled: true
      visualize: true
      polygon_pub_topic: collision_monitor/slow_zone
      holonomic: false
      velocity_polygons: ["slow_forward", "slow_reverse"]
      # Same split as StopZone, on the 2026-11-10 sizing: ±0.355 half-width,
      # 0.65 m ahead of centre, trailing extent cut to 0.20 m.
      slow_forward:
        points: "[[-0.20, -0.355], [-0.20, 0.355], [0.65, 0.355], [0.65, -0.355]]"
        linear_min: 0.0
        linear_max: 1.2
        theta_min: -2.5
        theta_max: 2.5
      slow_reverse:
        points: "[[-0.65, -0.355], [-0.65, 0.355], [0.20, 0.355], [0.20, -0.355]]"
        linear_min: -1.2
        linear_max: 0.0
        theta_min: -2.5
        theta_max: 2.5
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /utlidar/scan

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother
      - collision_monitor
