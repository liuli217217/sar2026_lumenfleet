# Nav2 parameters for Unitree Go2 -- SLAM-concurrent variant.
# Copied from nav2_params.yaml (localization-against-a-saved-map variant);
# the only change is removing map_server from the managed lifecycle below.
# Localization and /map both come from slam_toolbox (go2_mapping_slam_toolbox
# .launch.py) running at the same time, not a pre-built map -- no map_server
# needed, static_layer subscribes to slam_toolbox's live /map directly
# (map_subscribe_transient_local already matches its publish QoS).
#
# Robot footprint: 0.70m x 0.35m  |  Max velocity: 0.30 m/s (safety limit)
#
# cmd_vel pipeline:
#   controller_server → cmd_vel_nav
#   velocity_smoother → cmd_vel_smoothed
#   collision_monitor → cmd_vel
#   go2_cmd_vel_bridge → /api/sport/request → robot

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /utlidar/robot_odom_retimed
    bt_loop_duration: 10
    default_server_timeout: 1000  # Nav2 default of 20ms is too tight on this
                                   # compute (confirmed via two independent
                                   # "Timed out waiting for action server to
                                   # acknowledge" failures, 2026-11-09)
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Lowered from 0.5: explore_lite replans immediately on every goal
      # success with no cooldown (confirmed in its source, explore.cpp).
      # A generous tolerance let nearby frontiers count as "reached"
      # near-instantly, triggering a tight replan loop against an
      # unchanged map. Tighter tolerance forces real movement first.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.60

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.1
      batch_size: 4000
      vx_std: 0.15
      vy_std: 0.15
      wz_std: 0.3
      vx_max: 0.40
      vx_min: -0.15
      vy_max: 0.25
      wz_max: 0.90
      min_x_velocity_threshold: 0.05
      min_y_velocity_threshold: 0.05
      min_theta_velocity_threshold: 0.1
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"   # Go2 can strafe
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_smoothing_distance: 0.5 #1.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0 #14
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Circumradius of 0.70m x 0.35m body ≈ 0.39m, padded to 0.40m
      robot_radius: 0.4
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /utlidar/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.45
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Lowered from 0.40 (2026-11-09): robot_radius 0.4 + inflation_radius
        # 0.4 required 1.6m of clearance on each side just to be plannable,
        # far too conservative for the narrow spaces/small rooms this robot
        # actually needs to navigate in competition. 0.15 brings the total
        # lethal+inflated boundary to 0.55m from an obstacle surface.
        inflation_radius: 0.15

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      robot_base_frame: base_link
      global_frame: map
      robot_radius: 0.4
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      # Rolling window instead of matching the static map's exact bounds.
      # Confirmed by repeated testing that a fixed-to-the-map costmap keeps
      # racing frontier exploration: a frontier goal is, by definition,
      # right at the edge of the currently-known map, so the costmap is
      # *always* just barely behind wherever the robot needs to go next --
      # faster map_update_interval only narrowed the race, didn't remove it.
      # Rolling + centered on the robot makes "out of bounds" structurally
      # impossible rather than a timing race. Tradeoff: the global planner
      # only sees this window, not the full cumulative map -- fine given
      # explore_lite is weighted toward nearby frontiers (potential_scale
      # 3.0 vs gain_scale 1.0), so goals shouldn't typically exceed this.
      rolling_window: true
      width: 15
      height: 15
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /utlidar/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.45
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Lowered from 0.40 (2026-11-09): robot_radius 0.4 + inflation_radius
        # 0.4 required 1.6m of clearance on each side just to be plannable,
        # far too conservative for the narrow spaces/small rooms this robot
        # actually needs to navigate in competition. 0.15 brings the total
        # lethal+inflated boundary to 0.55m from an obstacle surface.
        inflation_radius: 0.15

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planners: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.80
    min_rotational_vel: 0.40
    rotational_acc_lim: 1.6
    backup_dist: 0.30
    backup_speed: 0.05

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.40, 0.25, 0.80]    # [vx, vy, wz] — hard caps
    min_velocity: [-0.15, -0.25, -0.80]
    max_accel:  [0.4, 0.4, 0.8]
    max_decel: [-0.4, -0.4, -0.8]
    odom_topic: /utlidar/robot_odom_retimed
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.01, 0.02] #0.06 0.06 008
    velocity_timeout: 1.0

# ── Safety: collision_monitor ─────────────────────────────────────────────────
# StopZone  — immediately halts the robot if any scan point enters the polygon
# SlowZone  — halves velocity when a scan point enters the outer polygon
# Both zones are visualised in RViz for debugging
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["StopZone", "SlowZone"]
    StopZone:
      type: polygon
      # Sized against inflation_radius 0.15 (2026-11-09, see inflation_layer
      # above): robot_radius 0.4 + inflation_radius 0.15 = 0.55m
      # lethal/inflated extent from an obstacle surface. This clears that
      # boundary with a small margin, so the robot never stands somewhere
      # StopZone permits but the costmap's own inflation makes unplannable
      # (the deadlock that caused "Failed to create plan" on every retry,
      # even after a full costmap clear) -- while staying close to the
      # original ±0.55/±0.30 size so the zone still fits inside small rooms,
      # unlike the earlier ±0.85/±0.50 attempt (paired with inflation_radius
      # 0.4) which didn't.
      # Flat double_array: x1,y1, x2,y2, x3,y3, x4,y4
      points: "[[-0.60, -0.35], [-0.60, 0.35], [0.60, 0.35], [0.60, -0.35]]"
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: collision_monitor/stop_zone
    SlowZone:
      type: polygon
      # Sized to stay strictly outside the new StopZone boundary above
      # (2026-11-09), close to the original ±0.80/±0.45.
      points: "[[-0.85, -0.50], [-0.85, 0.50], [0.85, 0.50], [0.85, -0.50]]"
      action_type: slowdown
      slowdown_ratio: 0.5
      # Raised from the Nav2 default (4, i.e. the legacy max_points: 3) --
      # confirmed via bag analysis that a real wall sitting near this
      # polygon's edge was triggering on ordinary per-scan point-count noise
      # at the old threshold (2026-11-09).
      min_points: 7
      max_points: 6
      visualize: true
      polygon_pub_topic: collision_monitor/slow_zone
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /utlidar/scan

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother
      - collision_monitor
